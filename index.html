<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Цифровые часы</title>
  <style>
    body {
      color: white;
      font-family: Arial;
      text-align: center;
      padding-top: 120px;
      margin: 0;
      height: 100vh;
    }
    #time {
      font-size: 90px;
      font-family: monospace;
    }
    #date { font-size: 24px; }
    #greeting { font-size: 30px; margin-bottom: 10px; }
  </style>
</head>
<body>

  <div id="greeting"></div>
  <div id="time"></div>
  <div id="date"></div>

  <script>
    // Добавляет ноль спереди: 5 → "05"
    function twoDigits(n) {
      if (n < 10) {
        return "0" + n;
      }
      return n;
    }

    // Обновить часы
    function update() {
      let now = new Date();
      let h = now.getHours();
      let m = now.getMinutes();
      let s = now.getSeconds();

      document.getElementById("time").innerHTML =
        twoDigits(h) + ":" + twoDigits(m) + ":" + twoDigits(s);

      document.getElementById("date").innerHTML = now.toLocaleDateString("ru-RU", {
        weekday: "long", day: "numeric", month: "long"
      });

      // Фон и приветствие меняются в зависимости от времени суток
      if (h >= 6 && h < 12) {
        document.body.style.background = "#f59e0b";
        document.getElementById("greeting").innerHTML = "Доброе утро";
      } else if (h >= 12 && h < 18) {
        document.body.style.background = "#0ea5e9";
        document.getElementById("greeting").innerHTML = "Добрый день";
      } else if (h >= 18 && h < 23) {
        document.body.style.background = "#7c3aed";
        document.getElementById("greeting").innerHTML = "Добрый вечер";
      } else {
        document.body.style.background = "#0f172a";
        document.getElementById("greeting").innerHTML = "Доброй ночи";
      }
    }

    // Обновлять каждую секунду
    update();
    setInterval(update, 1000);
  </script>

</body>
</html>
